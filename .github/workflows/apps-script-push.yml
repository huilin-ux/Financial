name: Push Apps Script

on:
  push:
    branches:
      - main
    paths:
      - Code.gs
      - appsscript.json
      - .clasp.json
      - .claspignore
      - package.json
      - package-lock.json
      - .github/workflows/apps-script-push.yml
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing repository secret: CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Push files to Apps Script
        run: npm run gas:push

      - name: Update Apps Script deployment
        if: env.APPS_SCRIPT_DEPLOYMENT_ID != ''
        run: npm run gas:deploy:update
